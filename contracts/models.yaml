# LiteLLM proxy config (README §3.4): one OpenAI-compatible endpoint.
#
# Alloy = LiteLLM `simple-shuffle` model group (per-request random deployment).
# Solo = direct model name. Policy objects only emit model *names*.
#
# Run:    litellm --config contracts/models.yaml
# Client: point any OpenAI-compatible client at the proxy with model="alloy".

model_list:
  # --- alloy group: two deployments behind one name ---
  - model_name: alloy
    litellm_params:
      model: anthropic/claude-sonnet-4
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: alloy
    litellm_params:
      model: google/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # --- solo examples (uncomment to expose; policy: "solo:<model_name>") ---
  # - model_name: claude-sonnet-4
  #   litellm_params:
  #     model: anthropic/claude-sonnet-4
  #     api_key: os.environ/ANTHROPIC_API_KEY
  # - model_name: gemini-2.5-pro
  #   litellm_params:
  #     model: google/gemini-2.5-pro
  #     api_key: os.environ/GEMINI_API_KEY

router_settings:
  routing_strategy: simple-shuffle

litellm_settings:
  drop_params: true  # tolerate provider-specific param drift

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
