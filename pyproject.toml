[project]
name = "rl-hackathon"
version = "0.1.0"
description = "CTF Alloy Hackathon workspace — alloy of LLMs for CTF, SFT + RL with flag-as-reward"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
# Live scoreboard server + tests
web = ["fastapi>=0.110", "uvicorn>=0.29"]
# Cold-start SFT / EI training (Path 4 training side)
train = ["torch", "transformers", "datasets", "trl>=0.9", "peft", "accelerate"]
# veRL multi-turn GRPO (Path 4 flagship; optional — see path4/verl_grpo/README.md)
verl = ["verl"]
# Daytona sandbox backend (Path 3/4 scale-out)
daytona = ["daytona"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["contracts", "path4"]
# NOTE: tests must NOT require pytest-asyncio — use asyncio.run() inside sync test functions.
# Heavy deps (torch/trl/verl/daytona/docker/litellm) are optional imports; tests skip or mock them.
